<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>video-factory</title>
<style>
 :root{--bg:#14161a;--card:#1d2026;--card2:#191c21;--line:#2b3038;--ink:#e8e6e1;--dim:#9aa0aa;
       --warm:#d9a441;--cold:#6aa6c4;--ok:#4c8f5a;--no:#a05252}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 "Segoe UI",system-ui,sans-serif}
 a{color:var(--cold);text-decoration:none}
 header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
 h1{font-size:15px;margin:0 10px 0 0;font-weight:600;letter-spacing:.4px}
 .sp{flex:1}
 button,select,input,textarea{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
 button{cursor:pointer} button:hover{border-color:var(--warm)}
 button.pri{background:#2a2f38} button.pri:hover{background:#333a45}
 button.ghost{background:transparent;border-color:transparent;color:var(--dim)}
 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px}
 .dot.ok{background:var(--ok)}.dot.no{background:var(--no)}.dot.run{background:var(--warm);animation:pulse 1.2s infinite}
 @keyframes pulse{50%{opacity:.35}}
 .wrap{padding:14px 18px;max-width:1560px;margin:0 auto}
 .grid2{display:grid;grid-template-columns:minmax(380px,1fr) minmax(420px,1.25fr);gap:14px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
 .card h2{font-size:13px;color:var(--dim);font-weight:500;margin:0 0 10px}
 .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 .hint{color:var(--dim);font-size:12px}
 .chat{max-height:52vh;overflow:auto;padding-right:4px}
 .ev{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:6px 0}
 .ev.stage{border-color:var(--warm)} .ev.user{border-color:var(--cold)}
 .ev.page{border-color:#3d4b57} .ev.approval{border-color:var(--ok)}
 .ev b{font-weight:600}
 .ev .t{color:var(--dim);font-size:11px;margin-left:6px}
 details.log summary{color:var(--dim);font-size:11px;cursor:pointer}
 details.log pre{max-height:180px;overflow:auto;font:11px/1.5 ui-monospace,Consolas,monospace;color:#9fb0a5;white-space:pre-wrap}
 .steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
 .steps button{padding:5px 9px;font-size:12.5px}
 .pages{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:58vh;overflow:auto}
 .pg{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card2)}
 .pg img,.pg video{width:100%;display:block;background:#000}
 .pg .m{padding:6px 8px;font-size:11.5px;color:var(--dim)}
 .pg .m b{color:var(--ink);font-weight:500}
 .lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
 .li{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card2);position:relative}
 .li img{width:100%;display:block}
 .li .m{padding:7px 9px;font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
 .li .m b{color:var(--ink);font-weight:500}
 .badge{position:absolute;top:8px;left:8px;background:#000a;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}
 .ok{border-color:var(--ok)!important} .no{border-color:var(--no)!important}
 .q{font-size:12px} .q .r{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:6px 0}
 input[type=text],textarea{width:100%}
 .k{font-size:11.5px;color:var(--dim)} .k b{color:var(--ink);font-weight:500}
</style></head><body>
<header>
  <h1>video-factory</h1>
  <a href="#/" id="nav-home">首页</a>
  <a href="#/library" id="nav-lib">素材库</a>
  <span class="sp"></span>
  <span class="k" id="envline">环境自检中…</span>
  <button class="ghost" onclick="envCheck(1)">深检</button>
</header>
<div class="wrap" id="app">载入中…</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = (s) => (s||'').slice(11,16);
const mm = (t) => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;

const S = { view:'', project:'', state:null, events:[], since:0, es:null, lib:null, env:null };

// ---------- 环境自检 ----------
async function envCheck(deep) {
  $('#envline').textContent = deep ? '深检中（要开浏览器，约 20 秒）…' : '环境自检中…';
  const r = await fetch('/api/env' + (deep ? '?deep=1' : '')).then(r=>r.json());
  S.env = r;
  const bad = r.filter(c=>!c.ok);
  $('#envline').innerHTML = bad.length
    ? `<span class="dot no"></span>${bad.length} 项没准备好：${bad.map(c=>esc(c.name)).join('、')}`
    : `<span class="dot ok"></span>环境都就绪（${r.length} 项）`;
  $('#envline').title = r.map(c => `${c.ok?'✓':'✗'} ${c.name} ${c.hint||''}`).join('\n');
  if (S.view === 'home' || S.view === 'library') render();
}

// ---------- 路由 ----------
function route() {
  const h = location.hash || '#/';
  if (h.startsWith('#/w/')) { S.view='workbench'; S.project = decodeURIComponent(h.slice(4)); }
  else if (h.startsWith('#/library')) { S.view='library'; }
  else { S.view='home'; }
  if (h.startsWith('#/library') && !S.lib) loadLib();
  load();
}
window.addEventListener('hashchange', route);

async function load() {
  if (S.view === 'home') {
    const ps = await fetch('/api/projects').then(r=>r.json());
    renderHome(ps);
  } else if (S.view === 'workbench') {
    S.state = await fetch('/api/state?project='+encodeURIComponent(S.project)).then(r=>r.json());
    renderWorkbench();
    streamStart();
  } else {                    // 素材库：先把索引读完再画（以前是"读完前就画"，于是空着）
    await loadLib();
    renderLibrary();
  }
}

// ---------- 首页 ----------
function renderHome(ps) {
  const btn = {running:'看进度', awaiting:'去确认分镜', done:'观看', idle:'开始', failed:'去处理'}[0];
  $('#app').innerHTML = `
  <div class="grid2">
    <div class="card">
      <h2>新建视频</h2>
      <textarea id="topic" rows="3" placeholder="想讲什么？一句话就够，比如「背叛之后，男人还会不会爱自己老婆，讲给正在经历婚姻危机的人听」"></textarea>
      <div class="row" style="margin:10px 0">
        <label class="k">时长（参考） <input id="mins" type="text" value="6" size="3" style="width:56px"> 分钟</label>
        <label class="k">配音 <select id="voice">${(S.state?.voices||[
          ['zh-CN-XiaoxiaoNeural','小晓 · 女声（默认）'],['zh-CN-YunxiNeural','云希 · 男声'],
          ['zh-CN-YunjianNeural','云健 · 男声（沉稳）']]).map(([v,n])=>`<option value="${v}">${esc(n)}</option>`).join('')}</select></label>
        <label class="k">角色 <label><input type="checkbox" id="c1" checked> 小树（男）</label>
          <label><input type="checkbox" id="c2" checked> 小芽（女）</label></label>
      </div>
      <div class="row"><input id="name" class="k" type="text" placeholder="目录名（英文/数字，可留空自动取）" size="22">
        <button class="pri" onclick="createFilm()">开始制作</button></div>
      <div class="hint" style="margin-top:8px">风格固定 <b>warm-emotion</b>（暖纸本 · 处境图 · 小树/小芽 IP）。
        资料（PDF/文案/图片）以后从素材库拖进来；现先把文件放到 <code>projects/新片名/materials/</code>。</div>
      <div id="newlog" class="hint" style="white-space:pre-wrap"></div>
    </div>
    <div class="card">
      <h2>最近的视频</h2>
      ${ps.length ? ps.map(p=>`
        <div class="row" style="border-top:1px solid var(--line);padding:8px 0">
          <span class="dot ${p.status==='running'?'run':p.status==='done'?'ok':p.status==='failed'?'no':''}"></span>
          <a href="#/w/${encodeURIComponent(p.id)}"><b>${esc(p.title)}</b></a>
          <span class="k">${p.pages} 页 · ${p.cues} 句${p.images?` · ${p.images} 张图等你看看`:''}</span>
          <span class="sp"></span>
          <span class="k">${({running:'制作中',awaiting:'等你确认',done:'已完成',idle:'未开始',failed:'出错了'})[p.status]||''}${p.running?` · ${esc(p.running)}`:''}</span>
          <a href="#/w/${encodeURIComponent(p.id)}">${({running:'看进度',awaiting:'去确认',done:'观看',idle:'打开',failed:'去处理'})[p.status]||'打开'}</a>
        </div>`).join('') : '<div class="hint">还没有片子。左边写一句话就能开一部。</div>'}
    </div>
  </div>`;
}

async function createFilm() {
  const topic = $('#topic').value.trim();
  if (!topic) { alert('先写一句"想讲什么"'); return; }
  const cast = [$('#c1').checked&&'小树', $('#c2').checked&&'小芽'].filter(Boolean);
  const body = {topic, title: topic.slice(0,18), minutes: parseFloat($('#mins').value)||6,
                voice: $('#voice').value, cast, name: $('#name').value.trim()};
  $('#newlog').textContent = '建片中…';
  const r = await fetch('/api/new', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).then(r=>r.json());
  $('#newlog').textContent = r.log || '';
  if (r.ok) location.hash = '#/w/'+encodeURIComponent(r.project);
}

// ---------- 工作台 ----------
const STAGE_TXT = {start:'开始', done:'好了', failed:'没成'};
function renderWorkbench() {
  const st = S.state || {}, p = st.project || {};
  $('#app').innerHTML = `
  <div class="grid2">
    <div>
      <div class="card">
        <div class="row"><b>${esc(p.title||S.project)}</b>
          <span class="k">${p.pages} 页 · ${p.cues} 句${p.film?' · 已有成片':''}</span><span class="sp"></span>
          <span class="k" id="runline">${p.running?`正在${esc(p.running)}…`:'空闲'}</span>
          <button class="pri" id="pausebtn" onclick="togglePause()">${S.state?.paused?'继续制作':'暂停'}</button>
        </div>
        <div class="row" style="margin-top:8px">
          <span class="dot ${p.running?'run':(S.state?.next?.step?'':'ok')}"></span>
          <span id="nextline">下一步：${esc(S.state?.next?.why || '')}${S.state?.next?.step?`（自动做「${esc(S.state.next.step)}」）`:''}</span>
        </div>
        <div class="hint" style="margin-top:6px">流程自动往下走（台词 → 分镜确认 → 出图 → 看图 → 排页 → 配音 → 字幕 → 渲染）。
          你要做的是三件事：<b>说</b>（下面消息框）、<b>点头</b>（审批卡）、<b>看</b>（右边画面）。</div>
      </div>
      <div class="card">
        <h2>对话 · 过程</h2>
        <div class="chat" id="chat"></div>
        <div style="margin-top:10px" class="row">
          <input id="say" type="text" placeholder="想改哪里，直接说（例：第 5 页那句改短一点；第 12 页的图重画）">
          <button class="pri" onclick="say()">发送</button>
        </div>
      </div>
      ${gateCard()}
    </div>
    <div>
      <div class="card">
        <div class="row"><h2 style="margin:0">画面</h2><span class="sp"></span>
          <span class="k" id="subs" style="display:none"></span></div>
        <div id="film"></div>
        <div class="pages" id="pages" style="margin-top:10px"></div>
      </div>
      <div class="card"><h2>出图</h2>
        <div class="k" id="qline">队列是空的</div>
        <div class="hint" style="margin-top:6px">要加一张图不必在这里点：在下面说「第 7 页换一张：……」，或在素材库里点「重画」。</div>
      </div>
      <div class="card"><h2>产物</h2><div class="lib" id="arts"></div></div>
    </div>
  </div>`;
  renderEvents(); renderPages(); renderQueue(); renderArts(); renderFilm();
}

function gateCard() {
  const g = S.state?.gates || {}, gs = S.state?.gate_state || {};
  return Object.entries(g).map(([k,v])=>`
    <div class="card" style="border-color:${gs[k]==='ok'?'var(--ok)':'var(--warm)'}">
      <div class="row"><b>审批 · ${esc(v.label)}</b><span class="sp"></span>
        <span class="k">${gs[k]==='ok'?'已通过':gs[k]==='no'?'已打回':'等你确认'}</span></div>
      <div class="hint">${esc(v.hint)}　<code>${esc(v.file)}</code></div>
      <div class="row" style="margin-top:8px">
        <input id="gn_${k}" type="text" placeholder="要改什么（可留空）">
        <button class="pri" onclick="gate('${k}','ok')">✓ ${esc(v.ask)}</button>
        <button onclick="gate('${k}','no')">✗ 打回</button>
      </div>
    </div>`).join('');
}

function renderEvents() {
  const chat = $('#chat'); if (!chat) return;
  chat.innerHTML = S.events.slice(-160).map(e => {
    const t = `<span class="t">${fmtT(e.at)}</span>`;
    if (e.kind === 'stage') return `<div class="ev stage"><b>${esc(e.stage)}</b> ${esc(e.detail||'')} ${t}</div>`;
    if (e.kind === 'page') return `<div class="ev page">第 ${esc((e.id||'').replace(/^p/,''))} 页 · <b>${esc(e.status)}</b> ${esc(e.detail||'')} ${t}</div>`;
    if (e.kind === 'approval') return `<div class="ev approval">${esc(e.key)} → <b>${e.verdict==='ok'?'通过':'打回'}</b> ${esc(e.note||'')} ${t}</div>`;
    if (e.kind === 'say') return `<div class="ev user">你说：${esc(e.text)} ${t}</div>`;
    if (e.kind === 'agent') return `<div class="ev agent"><b>导演</b>：${esc(e.text)} ${t}</div>`;
    if (e.kind === 'perm') return `<div class="ev approval">要你点一下：<b>${esc(e.action||'工具')}</b>
      <span class="k">${esc((e.resources||[]).join(' ').slice(0,80))}</span> ${t}
      <button onclick="perm('${esc(e.id)}','once')">允许一次</button>
      <button onclick="perm('${esc(e.id)}','always')">总是允许</button>
      <button onclick="perm('${esc(e.id)}','reject')">拒绝</button></div>`;
    if (e.kind === 'log') return `<details class="log"><summary>日志 ${t}</summary><pre>${esc(e.text)}</pre></details>`;
    return '';
  }).join('');
  chat.scrollTop = chat.scrollHeight;
}

function renderPages() {
  const el = $('#pages'); if (!el) return;
  el.innerHTML = '<div class="hint">正在读时间轴…</div>';
  fetch('/api/timeline?project='+encodeURIComponent(S.project)).then(r=>r.json()).then(tl=>{
    try {
      const spec = Array.isArray(S.state?.page_spec) ? S.state.page_spec : [];
      el.innerHTML = (tl.pages||[]).map(p=>{
        const spec1 = spec.find(x=>x.id===p.id) || {};
        const img = spec1.asset ? `/api/libfile?rel=${encodeURIComponent(spec1.asset)}` : '';
        const cues = (p.cues||[]).map(c=>`<div>${mm(c.s)} ${esc(c.t)}</div>`).join('');
        return `<div class="pg">${img?`<img src="${img}" loading="lazy">`:'<div style="padding:24px" class="hint">（这页还没配图）</div>'}
          <div class="m"><b>第 ${p.id.replace(/^p/,'')} 页</b> ${mm(p.start)}–${mm(p.end)} · ${esc(p.title||'')}
          <details><summary class="hint">口播（${(p.cues||[]).length} 句）</summary>${cues||'<span class="hint">还没写</span>'}</details></div></div>`;
      }).join('') || '<div class="hint">先跑「剧本」「配音」，这里会按真实语速排出每页。</div>';
    } catch (e) {
      el.innerHTML = `<div class="hint">逐页卡出错：${esc(e.message)}（时间轴拿到 ${(tl.pages||[]).length} 页）</div>`;
    }
  }).catch(e=>{ el.innerHTML = `<div class="hint">读时间轴失败：${esc(e.message)}</div>`; });
}

function renderQueue() {
  const el = $('#qline'); if (!el) return;
  const q = S.state?.queue || [];
  if (!q.length) { el.textContent = '队列是空的'; return; }
  const by = {};
  q.forEach(t => by[t.status] = (by[t.status] || 0) + 1);
  const txt = Object.entries(by).map(([k, n]) => `${({queued:'排队', browser:'挂角色', prompt:'写词',
    generating:'生成中', fetching:'取图', review:'等你看看', failed:'失败', retry:'重做'})[k] || k} ${n}`).join(' · ');
  const bad = q.filter(t => t.status === 'failed');
  el.innerHTML = `${txt}` + (bad.length ? `　<a href="#/library">去处理</a>` : '');
}

function renderArts() {
  const el = $('#arts'); if (!el) return;
  el.innerHTML = (S.state?.artifacts||[]).map(f=>{
    const url = `/api/file?project=${encodeURIComponent(S.project)}&rel=${encodeURIComponent(f.rel)}`;
    const body = f.kind==='video' ? `<video src="${url}" controls preload="metadata" style="width:100%"></video>`
      : f.kind==='image' ? `<a href="${url}" target="_blank"><img src="${url}" loading="lazy" style="width:100%"></a>`
      : `<div style="padding:8px;font-size:11.5px" class="hint">${esc(f.rel)}</div>`;
    return `<div class="li">${body}<div class="m"><b>${esc(f.rel)}</b><span>${f.kb} KB</span></div></div>`;
  }).join('') || '<div class="hint">还没有产物。</div>';
}

function renderFilm() {
  const el = $('#film'); if (!el) return;
  const films = (S.state?.artifacts||[]).filter(f=>f.kind==='video');
  if (!films.length) { el.innerHTML = '<div class="hint">成片还没渲出来（跑「渲染」）。</div>'; return; }
  const subbed = films.find(f=>f.rel.includes('有字幕')) || films[0];
  const clean = films.find(f=>f.rel.includes('无字幕')) || films[0];
  const u = (f)=>`/api/file?project=${encodeURIComponent(S.project)}&rel=${encodeURIComponent(f.rel)}`;
  el.innerHTML = `<video id="v" src="${u(clean)}" controls preload="metadata" style="width:100%;border-radius:10px"></video>
    <div class="row" style="margin-top:8px">
      <button onclick="subs(1)">看带字幕版</button><button onclick="subs(0)">看无字幕版</button>
      <a href="${u(clean)}" download>下载无字幕</a><a href="${u(subbed)}" download>下载带字幕</a>
      <span class="k" id="which"></span></div>`;
  $('#subs').textContent = '';
  window._films = {subbed, clean};
}

// ---------- 动作 ----------
async function runStep(step) {
  const r = await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({project:S.project, step})}).then(r=>r.json());
  if (r.error) alert(r.error);
  setTimeout(()=>{ S.since = 0; S.events = []; streamRestart(); }, 300);
}
async function togglePause() {
  const on = !(S.state?.paused);
  await fetch('/api/pause', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({project: S.project, on})}).then(r=>r.json());
  load();
}
async function say() {
  const t = $('#say').value.trim(); if (!t) return;
  $('#say').value = '';
  const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({project:S.project, text:t})}).then(r=>r.json()).catch(e=>({error:String(e)}));
  if (r.error) alert('交给 agent 失败：' + r.error);
}
async function perm(id, decision) {
  await fetch('/api/perm',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({project:S.project, id, decision})});
  load();
}
async function gate(k, v) {
  const note = ($('#gn_'+k)||{}).value || '';
  await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({project:S.project, gate:k, verdict:v, note})});
  load();
}
async function enqueue() {
  const page=$('#qpage').value.trim(), cast=$('#qcast').value, scene=$('#qscene').value.trim();
  if(!page||!scene){alert('页与处境都要填');return;}
  await fetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({project:S.project,page,cast,scene})});
  $('#qscene').value=''; load();
}
async function retry(id,page) {
  await fetch('/api/queue/retry',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({project:S.project,id,page})});
  load();
}
async function mark(rel,v) {
  await fetch('/api/mark',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({project:S.project,rel,verdict:v})});
  load();
}
function subs(on) {
  const f = on ? window._films.subbed : window._films.clean;
  $('#v').src = `/api/file?project=${encodeURIComponent(S.project)}&rel=${encodeURIComponent(f.rel)}`;
  $('#which').textContent = on ? '带字幕' : '无字幕';
}

// ---------- 事件流 ----------
function streamStart(){ streamRestart(); }
function streamRestart() {
  if (S.es) S.es.close();
  S.events = []; S.since = 0;
  S.es = new EventSource(`/api/events?project=${encodeURIComponent(S.project)}&since=0`);
  S.es.onmessage = (m)=>{
    const e = JSON.parse(m.data);
    S.events.push(e); if (S.events.length>400) S.events.shift();
    renderEvents();
    if (e.kind==='stage') { setTimeout(()=>{ /* 阶段完了刷状态 */ }, 200); if (e.status!=='start') load(); }
  };
  S.es.onerror = ()=>{ S.es.close(); setTimeout(streamRestart, 3000); };
}

// ---------- 素材库 ----------
async function loadLib(){ S.lib = await fetch('/api/library').then(r=>r.json()); }
function renderLibrary() {
  const ims = (S.lib?.images)||[];
  const cast = {};
  ims.forEach(i => { const c = i.cast || '未标'; (cast[c] = cast[c]||[]).push(i); });
  const card = (i)=>`<div class="li ${i.status==='已通过'?'ok':i.status==='打回'?'no':''}">
    <span class="badge">${esc(i.cast||'—')}</span>
    <a href="/api/libfile?rel=${encodeURIComponent(i.file)}" target="_blank"><img src="/api/libfile?rel=${encodeURIComponent(i.file)}" loading="lazy"></a>
    <div class="m"><b>${esc(i.file)}</b>
      <span>${esc(i.scene||'')}</span>
      <span>${i.w}×${i.h} · 芽 ${i.sprout_px} · 留白带 ${i.band_std}${i.sprout_px===0?' ⚠':''}${i.band_std>12?' ⚠':''}</span>
      <span>${i.used_by?.length? '用在 '+esc(i.used_by.join(' ')) : '还没被用'}</span>
      <span class="row"><button class="ghost" onclick="assign('${esc(i.file)}')">指定给页…</button><button class="ghost" onclick="regen('${esc(i.file)}','${esc(i.cast||'小树')}')">重画</button>
        <span class="k">${esc(i.status||'')}</span></span></div></div>`;
  $('#app').innerHTML = `
  <div class="card"><h2>环境（生图相关）</h2>${(S.env||[]).map(c=>`<div class="k"><span class="dot ${c.ok?'ok':'no'}"></span>${esc(c.name)} ${esc(c.hint||'')}</div>`).join('')||'<div class="hint">点右上角"深检"</div>'}</div>
  ${Object.entries(cast).map(([c, list])=>`
    <div class="card"><h2>${c}（${list.length} 张）</h2><div class="lib">${list.map(card).join('')}</div></div>`).join('')
    || '<div class="hint">索引还没生成：跑一次「素材」阶段（tools/lib_index.py）。</div>'}`;
}
async function assign(file) {
  const proj = S.project || prompt('给哪部片子的页？（工程名，例 emotion-full）', 'emotion-full');
  if (!proj) return;
  const page = prompt('指定给哪一页？（例 p07）', '');
  if (!page) return;
  const r = await fetch('/api/assign', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({project: proj, page, asset: file})}).then(r=>r.json());
  alert(r.ok ? `${page} 已换成 ${file}（页代码重生成好了）` : ('没成：' + (r.error || r.log || '')));
}
function regen(file, cast) {  const scene = prompt('重画这张：把处境描述改一改（或原样回车）', '');
  if (scene === null) return;
  const page = prompt('给哪一页用？（例 p07）', '');
  if (!page) return;
  fetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({project:S.project,page,cast,scene:scene||'（沿用原处境，稍作变化）',
                          out: file.replace('.png','-v2.png')})}).then(()=>{
    alert('已入队。等执行器做（面板里点「出图」或让 agent 跑）');
  });
}

route(); envCheck(0);
</script></body></html>
