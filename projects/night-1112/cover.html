<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>night-1112 · 3:4 封面</title>
<style>
  :root{
    --ink:#F2F6F7; --muted:#8C9AA5; --dim:#5C6A74;
    --cyan:#35E0D0; --orange:#FFA23A; --red:#FF5A6A;
    --font:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1440px;overflow:hidden;background:#05070A}
  body{font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  #cover{
    position:relative;width:1080px;height:1440px;overflow:hidden;
    background:
      radial-gradient(720px 620px at 76% 26%,rgba(53,224,208,.12),transparent 68%),
      radial-gradient(620px 560px at 16% 82%,rgba(255,162,58,.10),transparent 70%),
      radial-gradient(900px 800px at 50% 46%,#0D1218 0%,#080B0F 56%,#05070A 100%);
    color:var(--ink);
  }
  #cover::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 80% 76% at 50% 48%,#000 35%,transparent 100%);
    opacity:.6;
  }
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse 78% 72% at 50% 48%,transparent 56%,rgba(0,0,0,.46) 100%);pointer-events:none}
  .top{
    position:absolute;left:72px;right:72px;top:56px;display:flex;justify-content:space-between;align-items:center;
    font-size:22px;letter-spacing:.16em;color:#6E7D87;font-weight:600;
  }
  .top b{color:var(--cyan);font-weight:800}
  .top .tag{font-size:18px;color:#49565F;letter-spacing:.2em}
  .title{
    position:absolute;left:84px;top:214px;
  }
  .title .line{font-size:156px;line-height:.98;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
  .title .line + .line{margin-top:12px}
  .title .cyan{color:var(--cyan);text-shadow:0 0 44px rgba(53,224,208,.28)}
  .title .orange{color:var(--orange);text-shadow:0 0 46px rgba(255,162,58,.25)}
  .rule{position:absolute;left:88px;top:570px;width:120px;height:3px;background:linear-gradient(90deg,var(--cyan),transparent);box-shadow:0 0 18px rgba(53,224,208,.4)}
  .sub{
    position:absolute;left:88px;top:608px;width:700px;font-size:40px;line-height:1.55;color:#A6B2BA;font-weight:500;
  }
  .sub b{color:var(--cyan);font-weight:800}
  .sub .orange{color:var(--orange);font-weight:800}

  .heart-wrap{position:absolute;left:536px;top:756px;width:450px;height:450px;filter:drop-shadow(0 0 58px rgba(53,224,208,.16))}
  .heart{width:100%;height:100%}
  .crack{stroke:#07090C;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ring{position:absolute;left:474px;top:694px;width:574px;height:574px;border-radius:50%;border:1px solid rgba(255,162,58,.30);box-shadow:0 0 80px rgba(255,162,58,.10),inset 0 0 90px rgba(255,162,58,.05)}
  .ring::before{content:"";position:absolute;inset:36px;border-radius:50%;border:1px dashed rgba(255,162,58,.18)}

  .phone{
    position:absolute;left:76px;top:850px;width:396px;height:344px;border-radius:32px;padding:20px;
    background:linear-gradient(180deg,rgba(20,28,35,.96),rgba(9,14,18,.96));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 26px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06),0 0 60px rgba(53,224,208,.05);
  }
  .phone::before{content:"";position:absolute;left:50%;top:10px;width:94px;height:20px;transform:translateX(-50%);border-radius:0 0 14px 14px;background:#070A0E;border:1px solid rgba(255,255,255,.06);border-top:0}
  .phone-head{display:flex;align-items:center;gap:10px;margin:10px 4px 0;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.07)}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#22313C,#131B22);border:1px solid rgba(53,224,208,.35);position:relative;overflow:hidden;flex:none}
  .avatar::before{content:"";position:absolute;left:50%;top:8px;width:11px;height:11px;transform:translateX(-50%);border-radius:50%;background:#9DB3BD}
  .avatar::after{content:"";position:absolute;left:50%;bottom:-5px;width:24px;height:18px;transform:translateX(-50%);border-radius:50%;background:#6E8792}
  .who{font-size:20px;font-weight:700;color:#D7E2E6}
  .status{margin-left:auto;font-size:14px;color:#5E707B}
  .chat{display:flex;flex-direction:column;gap:12px;padding:18px 4px 0}
  .bubble{max-width:88%;padding:13px 16px;border-radius:18px;font-size:21px;line-height:1.4;font-weight:500}
  .bubble.in{align-self:flex-start;background:#1A242D;color:#DCE6EA;border:1px solid rgba(255,255,255,.06);border-bottom-left-radius:6px}
  .bubble.out{align-self:flex-end;background:linear-gradient(135deg,#1F6E68,#164B48);color:#E9FFFC;border:1px solid rgba(53,224,208,.22);border-bottom-right-radius:6px}
  .read{align-self:flex-end;font-size:13px;color:#576873;letter-spacing:.08em;margin-top:-4px}

  .pill{
    position:absolute;left:540px;top:1210px;display:inline-flex;align-items:center;gap:10px;
    height:44px;padding:0 18px;border-radius:99px;font-size:18px;font-weight:700;letter-spacing:.06em;
    color:var(--orange);background:rgba(255,162,58,.10);border:1px solid rgba(255,162,58,.28);
  }
  .pill i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
  .bottom{
    position:absolute;left:72px;right:72px;bottom:54px;display:flex;align-items:center;justify-content:space-between;
    font-size:20px;letter-spacing:.16em;color:#5A6872;font-weight:600;
  }
  .bottom b{color:#AEBBC2;font-weight:700}
  .bottom .time{font-size:17px;color:#46535C;letter-spacing:.12em}
</style>
</head>
<body>
<div id="cover">
  <div class="vignette"></div>
  <div class="top">
    <div><b>夜读</b> · 婚姻信任</div>
  </div>

  <div class="title">
    <div class="line">原谅了</div>
    <div class="line">却<span class="orange">放不下</span></div>
  </div>
  <div class="rule"></div>
  <div class="sub">信任崩塌后，<br><b>最智慧的做法</b>是什么？</div>

  <div class="ring"></div>
  <div class="heart-wrap">
    <svg class="heart" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#35E0D0"/>
          <stop offset=".55" stop-color="#FFA23A"/>
          <stop offset="1" stop-color="#FF7A45"/>
        </linearGradient>
      </defs>
      <path d="M100 174C82 158 28 125 28 78c0-28 20-46 44-46 13 0 24 6 28 16 4-10 15-16 28-16 24 0 44 18 44 46 0 47-54 80-72 96Z"
            fill="rgba(255,162,58,.07)" stroke="url(#hg)" stroke-width="4"/>
      <path class="crack" d="M100 54l-8 34 18 12-12 28 22 14-10 24"/>
      <path class="crack" d="M64 84l24 8M138 104l-20 12" opacity=".8"/>
    </svg>
  </div>

  <div class="phone">
    <div class="phone-head">
      <span class="avatar"></span>
      <span class="who">她</span>
      <span class="status">在线</span>
    </div>
    <div class="chat">
      <div class="bubble in">我原谅你了</div>
      <div class="bubble out">可我还是会查你手机</div>
      <div class="read">已读</div>
    </div>
  </div>

  <div class="pill"><i></i>背叛之后 · 信任重建</div>

  <div class="bottom">
    <div><b>李安</b> · 夜读</div>
    <div class="time">先接住，再往前走。</div>
  </div>
</div>
</body>
</html>
